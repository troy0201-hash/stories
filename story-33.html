    <h1>紙船的遠行</h1>
    <div class="sub">能啟程，就贏過停在岸邊。</div>
    <div class="story">
    <p>偏鄉孩子用作業紙摺船，寫願望放進溪裡。『希望走出這座山』。</p>
    <p>十年後他真的考上醫學院，回村義診。說：『那艘船，我一直帶著。』</p>
