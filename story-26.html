    <h1>一顆種子的耐心</h1>
    <div class="sub">你現在埋下的，未必明天發芽，但一定會。</div>
    <div class="story">
    <p>他在陽台種番茄，播下種子四十天沒動靜，差點拔掉。</p>
    <p>第五十天，綠芽破土。他才懂：土地不是慢，是在替你醞釀。</p>
    <p>後來他創業屢敗，總想起那顆種子——『還沒到天數，就再等一等。』</p>
