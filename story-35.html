    <h1>滿天星下的決定</h1>
    <div class="sub">渺小，不代表不能發光。</div>
    <div class="story">
    <p>她總覺得自己平凡，直到露營夜看見銀河——每顆星都不大，卻撐起整片夜。</p>
    <p>她開始經營小社群，幫陌生人解答難題。人說：『你像其中一顆，不大，但有人因你認路。』</p>
