    <h1>關於這個角落</h1>
    <div class="story">
      <p>「微光」始於一個簡單的想法：每個人都曾在某些瞬間，被一句話、一個畫面、一段關係輕輕接住過。</p>
      <p>這裡收著 50 篇短篇——關於愛、遺憾、勇氣，與慢慢痊癒的時刻。另外還有並列的「無光」站，收那些不被看見的、暗處的故事；以及「夜讀」站，留給成年人自己的夜。</p>
      <p>所有故事皆為原創虛構，寫給願意在忙碌裡停三分鐘的你。如果某篇說中了你藏起來的那句話，那就是它存在的意義。</p>
      <p>願你讀完，仍敢溫柔。</p>
    </div>
    <p class="end">— 微光 · 故事 —</p>
