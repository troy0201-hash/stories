    <h1>巷口的貓</h1>
    <div class="sub">有時候，被一個生命需要，就是活下去的理由。</div>
    <div class="story">
    <p>離職、分手、房租漲，那一年她像被生活按在地上磨。每天下班，她坐在巷口石階上發呆，一隻三花貓會跳上來，蹭她的手。</p>
    <p>她開始買罐頭，貓等她，她也等貓。彷彿這城市裡，只剩下這麼一個約定還沒毀。</p>
    <p>有天她請假沒出門，貓在門口叫了一上午。她開門，貓鑽進來，窩在她腳邊睡著。那是她半年來第一次，有人（或貓）主動選擇陪她。</p>
    <p>後來她慢慢好起來，換了工作，搬了家。搬家那天，她把貓託付給樓下阿婆。貓沒回頭看她，她卻覺得被原諒了。</p>
    </div>
