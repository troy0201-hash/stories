    <h1>浪裡的練習</h1>
    <div class="sub">被打翻，是學會站穩的代價。</div>
    <div class="story">
    <p>他學衝浪，前半月全被浪打翻。教練說：『你不是學站，是學被打下來還要上。』</p>
    <p>某天他終於站上板，回頭對浪笑。原來敗仗打多了，就成經驗。</p>
