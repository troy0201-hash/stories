    <h1>飛不起來的鳥</h1>
    <div class="sub">飛不遠，也要拍翅。</div>
    <div class="story">
    <p>受傷康復的鳥被放回野地，飛幾公尺就落地。牠仍每天拍翅。</p>
    <p>動物醫生說：『牠知道飛不回從前，但沒放棄當會飛的鳥。』</p>
    <p>看的人濕了眼——我們多少人也一樣，拍翅就好。</p>
