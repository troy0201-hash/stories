    <h1>亮起的那盞燈</h1>
    <div class="sub">靈感來時，別讓它熄。</div>
    <div class="story">
    <p>他半夜想到點子，爬起寫下，隔天做成產品雛形。同事說他運氣好。</p>
    <p>他說：『運氣是，燈亮時我沒翻身睡回去。』</p>
