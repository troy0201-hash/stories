    <h1>畫壞的那張</h1>
    <div class="sub">搞砸的，往往是最後成功的草稿。</div>
    <div class="story">
    <p>美術系女生把參賽畫弄掉顏料，全毀。她哭一晚，隔天重畫。</p>
    <p>新畫反而入選。評審說：『你看得出來，這張有破釜沉舟的勁。』</p>
    <p>她把那張毀掉的掃進框裡掛牆：『這是我的第一稿。』</p>
