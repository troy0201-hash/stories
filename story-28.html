    <h1>往上走的樓梯</h1>
    <div class="sub">每一步都小，合起來就是高度。</div>
    <div class="story">
    <p>他從清潔工做到店長，用了十二年。別人問怎麼熬，他說：『每天多學一點，樓梯就多一階。』</p>
    <p>同事離職他留下，主管換他頂上。他說：『我沒跳級，只是沒停。』</p>
