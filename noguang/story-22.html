    <h1>舊鑰匙</h1>
    <div class="sub">鑰匙開的不是鎖，是誰。</div>
    <div class="story">
    <p>她在亡父遺物找到一把生鏽鑰匙，沒對應的鎖。她逐屋試，試到老宅閣樓小箱。</p>
    <p>箱開，裡面是一張出生證，名字不是她。父親欄寫著另一個男人。</p>
    <p>箱底信：『妳不是我親生，但我比誰都怕妳知道。』鑰匙，是留給她找答案的。</p>
