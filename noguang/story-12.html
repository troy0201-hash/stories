    <h1>寒冬裡的樹</h1>
    <div class="sub">最後一片葉，等不到春天。</div>
    <div class="story">
    <p>院裡老樹只剩一片葉，他說等葉落就去看她。她在遠方療養院。</p>
    <p>葉子掛了整個冬，他每天視訊給她看：『還在，像妳一樣撐著。』</p>
    <p>某夜大風，葉落。他趕去，她已經在清晨走了，手機停在播給他看葉子的畫面。</p>
    <p>春天樹發了新芽，他對著空床說：『妳贏了，葉子先走。』</p>
