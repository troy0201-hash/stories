    <h1>窗內的陌生人</h1>
    <div class="sub">你睡著時，有人替你活著。</div>
    <div class="story">
    <p>她總在清晨發現家裡被整理過，茶杯有喝過的痕。獨居的她開始裝針孔。</p>
    <p>畫面裡，深夜的她從床上坐起，走到廚房泡茶，動作熟練，卻背對鏡頭。</p>
    <p>她按下暫停，放大那雙手——指甲是藍的，她從不塗指甲油。</p>
    <p>鏡子裡，睡著的她和站著的她，同時轉頭看向鏡頭。</p>
