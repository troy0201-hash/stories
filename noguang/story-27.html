    <h1>棄車</h1>
    <div class="sub">車裡的人，從沒下來。</div>
    <div class="story">
    <p>山道發現一輛棄車，引擎溫，鑰匙在。後座安全座椅空，嬰兒不見。</p>
    <p>警調監視，半夜車門自己開，安全座椅自動扣上，又開。反覆，像在等人。</p>
    <p>三十年前同路段，一對母女失蹤，報案車正是同廠牌同色。</p>
