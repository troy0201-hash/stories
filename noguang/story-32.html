    <h1>石碑</h1>
    <div class="sub">名字刻上，就擦不掉。</div>
    <div class="story">
    <p>他夢見一片墓園，每碑刻熟悉名。走到最後一塊，空白，只寫『留』。</p>
    <p>醒來，爺爺當夜逝。他去墓園，新碑正是夢中那塊，名字剛刻。</p>
    <p>他問父：『那塊留的，是誰？』父不答，指他胸口。</p>
