    <h1>上鎖的第十三階</h1>
    <div class="sub">樓梯多出一層。</div>
    <div class="story">
    <p>租屋處樓梯，數來數去十三階，設計圖只有十二。他貼紅線標記，第二天紅線在第十三階。</p>
    <p>他守住，半夜聽見有人一階階上，到第十二階停下，鑰匙聲，開第十三階的門。</p>
    <p>他撲上去，門後是自己的房間，床上的自己正驚醒——兩人對視。</p>
    <p>房東說，前任租客也在那階失踪，從此樓梯偶爾多一階。</p>
