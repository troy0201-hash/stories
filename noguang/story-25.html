    <h1>冷掉的走廊</h1>
    <div class="sub">醫院裡，有些病房不住人。</div>
    <div class="story">
    <p>護理師夜巡，3 號房總傳咳嗽。查房卻空。护士长說：『那間十年前就封了。』</p>
    <p>她偷看，門縫裡一張病床，躺著和自己穿一樣制服的人，正回頭看她。</p>
    <p>隔天她請調，離職前最後一眼，3 號房門牌換成她的名字。</p>
