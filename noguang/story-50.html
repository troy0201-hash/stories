    <h1>暗櫥</h1>
    <div class="sub">櫥裡的不是衣服。</div>
    <div class="story">
    <p>他租屋，衣櫥深得異常。手電照，底層掛一排和他同款的衣，尺碼漸小。</p>
    <p>最小一件，標籤寫他小名。他童年確穿過。櫥深處有聲：『輪到你進來了。』</p>
    <p>他關櫥，搬走。新房客說，衣櫥深得異常。</p>
