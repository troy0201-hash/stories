    <h1>停擺的鐘</h1>
    <div class="sub">時間到了，人不走。</div>
    <div class="story">
    <p>祖父的座鐘停在他去世那刻，家人不敢修。他偷偷上鍊，鐘走了，屋裡卻涼了。</p>
    <p>每晚鐘敲十二下，客廳多一個人的腳步，繞到祖父搖椅坐下。搖椅輕晃。</p>
    <p>他揭開毯子，空的。可餘溫還在，像有人剛離座。</p>
    <p>他終於懂：鐘不是停了，是替祖父把時間留下了。</p>
