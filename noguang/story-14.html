    <h1>風暴中的船</h1>
    <div class="sub">海上有人，一直游。</div>
    <div class="story">
    <p>漁船遇風暴，他看見遠處有個人直立海面，隨浪起伏，面朝船。</p>
    <p>靠近，那人以同樣姿勢漂了整夜，眼睛睜著，嘴角帶笑。撈起，是具早已冰冷的屍。</p>
    <p>老船長看一眼：『這是二十年前的遇難者，每年風暴夜都會『游』回來點名。』</p>
    <p>他低頭，屍體腳踝繫著一條紅繩，和他奶奶說過的『引魂繩』一模一樣。</p>
