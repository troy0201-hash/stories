    <h1>地下室的光</h1>
    <div class="sub">下面有人，一直在敲。</div>
    <div class="story">
    <p>新家地下室，深夜傳來敲牆聲，規律三下。他敲回去，對面回三下。</p>
    <p>他鑿牆，發現夾層，裡面一具枯骨，手還舉著，指節磨禿。牆上刻滿『救我』。</p>
    <p>報警，鑑識說死者困死至少十年。他算算，十年前這屋的前屋主，正是他現在的房仲。</p>
    <p>當晚房仲失蹤，地下室牆，多了一組新的三下。</p>
