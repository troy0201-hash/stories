    <h1>林中的影</h1>
    <div class="sub">樹後有人，一直跟。</div>
    <div class="story">
    <p>他露營夜歸，林中有個黑影與他同速。他停，影停；他跑，影先到樹前。</p>
    <p>他點火把，影退入樹。天亮他發現，自己帳篷週圍一圈腳印，比他的小一號，繞了整圈。</p>
    <p>向導說：『那林子認得每個迷路的人，會送你到邊界——也會留一個。』</p>
