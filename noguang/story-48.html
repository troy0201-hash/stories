    <h1>冷床</h1>
    <div class="sub">床的另一半，有人躺。</div>
    <div class="story">
    <p>喪偶後，他睡單側。某夜被窩另一半微溫，似有人躺。他以為錯覺。</p>
    <p>連續七日，溫度準時。他低聲說：『妳冷就過來。』那側陷下淺淺。</p>
    <p>他笑，淚落：『原來妳一直佔著半邊。』</p>
