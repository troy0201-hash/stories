    <h1>冷鏡</h1>
    <div class="sub">鏡子比房間冷。</div>
    <div class="story">
    <p>他抑鬱，鏡子總結霧。某日霧散，鏡中他笑得燦爛——現實的他在哭。</p>
    <p>他伸手，鏡面結冰。鏡中伸手，溫的。兩手隔鏡相貼，一冷一熱。</p>
    <p>他漸明白：鏡裡那個，是病前快樂的自己，在替他暖。</p>
