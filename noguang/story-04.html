    <h1>閣樓的腳步</h1>
    <div class="sub">上面從來沒有儲藏室。</div>
    <div class="story">
    <p>老房子閣樓，半夜總有腳步。他上去看，空無一物，只有一灘濕腳印，通向牆。</p>
    <p>他貼了監視器，錄到凌晨四點，腳印自己出現，繞一圈，消失在牆裡。</p>
    <p>他敲開那面牆，裡面是個小空腔，擺著一雙小孩的鞋，和一張發黃的尋人啟事。</p>
    <p>啟事上的孩子，眉眼像極了他母親年輕時。</p>
