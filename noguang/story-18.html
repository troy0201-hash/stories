    <h1>煙裡的臉</h1>
    <div class="sub">抽完最後一根，他出來了。</div>
    <div class="story">
    <p>他戒菸三年，今夜又夢見父親在陽台抽。醒來，空氣有煙味，陽台菸蒂還溫。</p>
    <p>監視器拍到凌晨，陽台有個人影抽完一根，掐滅，走進客廳牆。</p>
    <p>他放大，人影側臉是父親，但手背有他自己的痣。</p>
    <p>他摸自己手背，那顆痣，今早才發現。</p>
