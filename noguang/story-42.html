    <h1>枯樹</h1>
    <div class="sub">冬天死的樹，春天不活。</div>
    <div class="story">
    <p>院中枯樹，妻生前種。他不肯砍，每春等發芽。三年，不發。</p>
    <p>他夢妻說：『樹替我死了，你別跟著。』醒，樹梢立一隻鳥，鳴三聲飛走。</p>
    <p>他伐樹，根下埋著妻的髮夾。他收起，種了新苗。</p>
