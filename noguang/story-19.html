    <h1>水底的房間</h1>
    <div class="sub">下去，就回不來。</div>
    <div class="story">
    <p>湖心傳說有水底房間，進去能見想見的人。她潛下去，真有扇窗，裡面是亡子寫作業。</p>
    <p>她敲窗，兒子抬頭笑，比嘴型：『媽別怕。』她伸手，玻璃溫熱，像活的。</p>
    <p>氧氣快盡，她不捨上浮。再低頭，房間不見，只剩自己呼出的氣泡，組成『再見』。</p>
    <p>打撈隊說，她笑著沉底，手裡攥著空氣。</p>
