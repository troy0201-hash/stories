    <h1>第七天的寄信人</h1>
    <div class="sub">人走後，信才到。</div>
    <div class="story">
    <p>父喪第七天，他收到一封平信，寄件人是父親。信裡寫：『別動書房抽屜第三格。』</p>
    <p>他打開，裡面是另一封沒寄出的信，給二十年前的自己，預言了今天的死法。</p>
    <p>他冷汗涔涔——抽屜更深處，還有寫給『下一個第七天』的信，收件人是他。</p>
    <p>信封尚溫。</p>
