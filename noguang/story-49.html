    <h1>霧田</h1>
    <div class="sub">田裡立著，沒種的人。</div>
    <div class="story">
    <p>他耕霧田，中央立一稻草人，臉是麻布。走近，麻布浮出五官，像他父。</p>
    <p>父十年前葬此田邊。他拔稻草人，內填空，只一張地契，寫『子嗣承田，需以命守』。</p>
    <p>霧散，稻草人原位，五官又平。風過，似嘆息。</p>
