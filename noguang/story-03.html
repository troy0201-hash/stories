    <h1>雨夜的順風車</h1>
    <div class="sub">他上車時，後座已經坐著一個人。</div>
    <div class="story">
    <p>大雨，他攔了輛計程車。上車才發現後座有個女人，低頭不語。</p>
    <p>司機從後照鏡看她：『你朋友？』他說不認識。女人緩緩抬頭——臉是空的。</p>
    <p>他嚇得跳車，滾進水溝。車開走，尾燈消失在雨裡。</p>
    <p>隔天新聞：同路段，十年前曾有女子搭便車遇害，屍體在雨夜被發現。</p>
