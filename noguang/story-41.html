    <h1>地下室階</h1>
    <div class="sub">階下還有階。</div>
    <div class="story">
    <p>他修水管入地下室，地板有道縫，透風。撬開，鐵梯下探，另一間地下室，擺滿舊傢俱。</p>
    <p>傢俱貼標：『上一位住戶遺留。』他查，這屋只他住過。標籤日期，是明天。</p>
    <p>他上鎖，當夜天花板傳腳步，從下而上。</p>
