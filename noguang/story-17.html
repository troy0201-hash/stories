    <h1>荒廢的旋转木马</h1>
    <div class="sub">音樂還在播，沒人騎。</div>
    <div class="story">
    <p>廢樂園的旋轉木馬，半夜自轉，音樂盒走調。他錄下，給做警的朋友聽。</p>
    <p>朋友說，這旋律是首失傳的安魂曲，只有本地一樁舊案用過。</p>
    <p>他查案，當年是群孩子在此失蹤，最後聽見的音樂正是這首。木馬上某匹，鞍下刻著名字。</p>
    <p>是他自己小時候的綽號。</p>
