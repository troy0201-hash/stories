    <h1>夜鴞</h1>
    <div class="sub">貓頭鷹叫，數人頭。</div>
    <div class="story">
    <p>村裡夜鴞叫三聲，翌日必走一人。他記錄半年，準。他設陷阱抓鴞，籠空，只留一根他自己的髮。</p>
    <p>長老說：『鴞不是報喪，是點名。叫幾聲，是還剩幾人記得這村。』</p>
    <p>他數，村已不足十戶。今夜鴞叫，九聲。</p>
