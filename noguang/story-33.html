    <h1>紅繩</h1>
    <div class="sub">繫上的，自己解不開。</div>
    <div class="story">
    <p>她腕上無故多一紅繩，扯不斷。外婆說那是『牽亡繩』，有人不想放你走。</p>
    <p>她追線，線盡於衣櫃底一隻銀鐲——是夭折姊姊的。姊姊從未謀面。</p>
    <p>鐲內刻：『妹，等我回來牽你。』紅繩，是姊牽的。</p>
