    <h1>霧裡的回家的路</h1>
    <div class="sub">你以為到家，其實才出發。</div>
    <div class="story">
    <p>山霧，他迷路，遇一農舍，老婦說『這就你家』。他竟覺得眼熟，睡下。</p>
    <p>醒來，屋裡掛滿他的照片，從嬰兒到現在。老婦端粥：『你爹走那年，你也就這麼大。』</p>
    <p>他翻出家譜，自己名字下面寫著『歿，七歲，霧夜走失』。</p>
    <p>他衝出門，霧散了，農舍不在，只有一塊塌了的墓碑，刻著他的名字。</p>
