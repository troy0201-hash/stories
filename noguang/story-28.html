    <h1>燭芯</h1>
    <div class="sub">蠟燭燒完，名字也燒完。</div>
    <div class="story">
    <p>守靈夜，他替亡母點蠟燭，燭芯爆出綠焰。長輩說：『那是她還有話。』</p>
    <p>他低聲問，燭火忽明忽暗，像點頭。他哭，火滅。</p>
    <p>他重點，火不綠。才知那綠，是母親最後一次，替他答應『別怕』。</p>
