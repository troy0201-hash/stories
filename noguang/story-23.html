    <h1>霧橋</h1>
    <div class="sub">過了橋，就回不了頭。</div>
    <div class="story">
    <p>他逃債夜走霧橋，橋中段欄斷。對岸有個人招手：『這邊走。』他猶豫，那人竟長得像年少時的自己。</p>
    <p>他跨過缺口，腳下一空——醒來在橋頭，晨霧散，橋完好。手機一則新聞：昨夜此橋墜一人，身份不明。</p>
    <p>他摸口袋，多了一把濕的、屬於自己的舊鑰匙。</p>
