    <h1>暗簾</h1>
    <div class="sub">簾後不是窗。</div>
    <div class="story">
    <p>新房客拉開臥室簾，以為窗，竟是牆，牆上畫著窗景，逼真到光會動。</p>
    <p>他摸，牆涼。夜裡畫中『窗景』起霧，浮出一行字：『別拉開真簾。』</p>
    <p>他驚覺，自己拉的，是畫裡的簾。真簾，在畫中那扇窗後。</p>
