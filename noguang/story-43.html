    <h1>煙房</h1>
    <div class="sub">煙散，人不在。</div>
    <div class="story">
    <p>他抽菸，煙霧裡浮出一個房間，與此同格局，但牆有血手印。煙散，印沒。</p>
    <p>他每次抽都見，手印位置每日下移，像有人順牆滑落。</p>
    <p>他戒菸，房不再現。搬家前最後一根，手印已到地板，指向上方——他的床。</p>
