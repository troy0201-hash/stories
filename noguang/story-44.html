    <h1>暗門</h1>
    <div class="sub">每間房都有一扇，開錯就換間。</div>
    <div class="story">
    <p>他住旅館，夢遊開了牆上的暗門，進另一間同款房，床上有另一個自己熟睡。</p>
    <p>他退回，暗門不見。次日櫃檯說，該房號昨夜無人登記，監視器拍到他進了又出。</p>
    <p>他查訂房紀錄，自己名字後多一個『貳』。</p>
