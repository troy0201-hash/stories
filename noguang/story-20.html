    <h1>無月之夜</h1>
    <div class="sub">沒有月亮，也能認路。</div>
    <div class="story">
    <p>村裡無月之夜，狗不叫，人不出門。他偏走夜路，看見前方飄著一點光，引他走。</p>
    <p>光停在老井邊，照見井底一張臉——是他。光說：『輪到你守井了。』</p>
    <p>他這才想起，祖父也是某個無月夜失蹤，從此村裡夜路有人引。</p>
    <p>天亮，村民發現井邊多雙鞋，和一支還亮著的手電。</p>
