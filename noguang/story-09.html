    <h1>末班後的月台</h1>
    <div class="sub">車走了，人留下了。</div>
    <div class="story">
    <p>末班車進站，她沒擠上，門關前看見車廂裡的自己，正對窗外笑。</p>
    <p>她追著軌道跑，月台卻越來越長。廣播說：『本班為末班，請旅客盡速離站。』</p>
    <p>她終於停下，發現月台空無一人，電子鐘停在 00:00，日期是她生日。</p>
    <p>她想起，今早醫生說，她的病，沒多少個末班了。</p>
