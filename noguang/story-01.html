    <h1>巷尾的第十一戶</h1>
    <div class="sub">有些房子，門牌從不連號。</div>
    <div class="story">
    <p>老街拆遷，唯獨巷尾那戶始終沒人動。門牌寫著「11」，可兩旁是 9 和 12。</p>
    <p>搬家公司小弟說，那屋裡有股潮味，像很多人很久沒呼吸。他不信邪，半夜跑去拍門。</p>
    <p>門開了一條縫，裡面黑得不像有燈。他看見自己的臉，映在對面鏡子——可屋裡沒有鏡。</p>
    <p>第二天他辭了工，再沒回過那條巷。地政說，那筆地根本不存在。</p>
