    <h1>鎖窗</h1>
    <div class="sub">窗外的人，想進來。</div>
    <div class="story">
    <p>她鎖窗睡，凌晨窗上有手印，從外。警說無人跡。她裝雙層鎖。</p>
    <p>隔日手印在兩層玻璃之間。她拆窗，夾層空，只剩一縷她的長髮。</p>
    <p>她想起，十年前同窗戶，曾有室友墜樓，頭髮長度一樣。</p>
