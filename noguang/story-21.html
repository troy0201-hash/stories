    <h1>走廊盡頭的門</h1>
    <div class="sub">走廊比記憶長。</div>
    <div class="story">
    <p>醫院深夜，他去找護士站，走廊怎麼走都到不了頭。每扇門編號跳號，13 之後是 14 又是 13。</p>
    <p>盡頭有扇沒編號的門，縫裡滲光。他推開，是自己病床，身上的管子還連著。</p>
    <p>床邊監護器響，護士衝進來急救。他低頭看自己——站在門外，透明。</p>
