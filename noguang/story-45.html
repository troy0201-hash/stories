    <h1>空教室</h1>
    <div class="sub">下課後，還有課。</div>
    <div class="story">
    <p>他回母校，空教室黑板上寫他的名字，旁批『未交』。他從未這麼逃過課。</p>
    <p>他擦，字重現。粉筆自己動，續寫：『你欠的那堂，遲早補。』</p>
    <p>他憶起，國中那堂，他缺席，當日地震，全班平安，唯獨代課老師遇險。</p>
