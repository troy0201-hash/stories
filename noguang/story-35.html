    <h1>霧湖</h1>
    <div class="sub">湖底有人，在等新來的。</div>
    <div class="story">
    <p>湖邊他釣魚，浮標沉，拉起一隻小手。鬆手，手沉回。水面浮字：『陪我。』</p>
    <p>他收竿走，回頭湖心立著一個孩子，朝他伸手。他認出，是幼時溺亡的弟弟。</p>
    <p>弟笑：『哥，水不冷，就黑。』霧起，弟沒。</p>
