    <h1>影手</h1>
    <div class="sub">影子比人誠實。</div>
    <div class="story">
    <p>他發現自己影子，動作慢半拍，且在他背對光時，手會指牆。</p>
    <p>他順指鑿牆，露出舊報紙：三十年前此屋兇案，兇手藏物於牆。</p>
    <p>物是一枚戒指，內圈刻他姓氏。影子，是當年死者指的路。</p>
