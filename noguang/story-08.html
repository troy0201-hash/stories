    <h1>鏡中遲到的倒影</h1>
    <div class="sub">你動手，它慢一秒。</div>
    <div class="story">
    <p>他發現鏡裡的自己，動作慢半拍。起初以為眼花，直到某天他舉杯，鏡中人沒舉。</p>
    <p>鏡中人抬頭，嘴型說：『換我了。』他伸手去摸，玻璃涼得刺骨，手穿了過去。</p>
    <p>再抬頭，鏡外是他，鏡內也是他——可真實的他，已經在另一側。</p>
    <p>妻子進來，對著鏡子梳頭，沒發現丈夫換了位置。</p>
