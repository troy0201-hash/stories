    <h1>最後一通的來電</h1>
    <div class="sub">深夜的電話，那頭是你自己。</div>
    <div class="story">
    <p>她獨居，手機凌晨三點響。號碼是自己的。</p>
    <p>接起，那頭是她的聲音：『別開門，他在樓梯間。』話音剛落，樓下傳來腳步。</p>
    <p>她報警，警察上來只見敞開的門，和一支還在震動的舊手機——是她三年前弄丟的那支。</p>
    <p>通聯紀錄顯示，那通電話從未撥出。</p>
