    <h1>霧路</h1>
    <div class="sub">走著走著，路沒了。</div>
    <div class="story">
    <p>他夜騎霧路，導航失訊。路兩旁電線桿逐根消失，最後連路也沒。</p>
    <p>車燈照見前方一塊牌：『此路止於 1998。』他手機日期，正是那年今日。</p>
    <p>他調頭，霧散，回到起點。里程表歸零。</p>
