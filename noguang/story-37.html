    <h1>舊照</h1>
    <div class="sub">照片裡的人，慢慢不見。</div>
    <div class="story">
    <p>全家福掛廳，他發現自己逐年變淡。問母，母說沒事。他偷拍對比，三年淡了三成。</p>
    <p>他查，前屋主同款照，最後一人完全消失，屋即空售。</p>
    <p>他摸自己手，還在。但照片裡，已只剩半個肩。</p>
