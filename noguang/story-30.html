    <h1>風暴天</h1>
    <div class="sub">天空裂開的那秒，看見自己。</div>
    <div class="story">
    <p>颱風夜，他拍閃電，畫面定格：雲裂處，懸著一張臉，是他，但老二十歲。</p>
    <p>他放大，臉唇動：『還沒輪到你。』雷止，圖存不了。</p>
    <p>次年同夜，叔父猝逝，遺照竟與那張臉同齡。</p>
