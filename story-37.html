    <div class="sub">抓不住的，就先鬆手，再找下一個。</div>
    <div class="story">
    <p>攀岩她卡在半壁，手快撐不住。教練喊：『鬆手，找脚點！』她一放，反而夠到凹槽。</p>
    <p>她悟到：有些執著是累贅，敢放，才夠得著下一步。</p>
