    <h1>搭一座橋</h1>
    <div class="sub">與其抱怨隔閡，不如動手搭。</div>
    <div class="story">
    <p>河兩岸村莊不和，小孩上學得繞一小時。他發起募款蓋便橋。</p>
    <p>被笑傻，他帶頭挖地基。三個月後橋通，兩村第一次一起辦廟會。</p>
    <p>他說：『橋不是水泥，是誰先伸的手。』</p>
