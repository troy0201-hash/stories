    <h1>織了一半的毯子</h1>
    <div class="sub">未完的，也可以很暖。</div>
    <div class="story">
    <p>外婆留半條沒織完的毯子。她接手，針腳生疏，卻一針針補上。</p>
    <p>毯子歪歪扭扭，她蓋著睡，夢見外婆在燈下教她起針。</p>
    <p>她懂了：有些人走了，愛還在手指間傳。</p>
