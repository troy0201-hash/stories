    <h1>一壺熱茶的傍晚</h1>
    <div class="sub">把一天放下，從倒茶開始。</div>
    <div class="story">
    <p>他工作焦頭爛額，妻不問，只倒一壺茶放他手邊。他喝一口，肩鬆了。</p>
    <p>後來每天傍晚，雷打不動一壺茶。他說：『那十分鐘，是每天唯一的喘口。』</p>
    <p>妻笑：『茶不貴，貴在你肯坐下。』</p>
