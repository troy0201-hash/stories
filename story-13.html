    <h1>躲在後排的她</h1>
    <div class="sub">有些愛，甘願隱身，只為看你發光。</div>
    <div class="story">
    <p>女兒大學畢業，邀了所有人，獨獨沒提媽媽。不是不愛，是覺得媽媽穿得太舊，怕同學笑。</p>
    <p>媽媽卻去了，坐在禮堂最後一排角落，穿了件洗到發白的外套。她舉著手機錄，鏡頭裡女兒領獎的樣子，笑得像花。</p>
    <p>典禮結束，人群散去。女兒一眼看見後排那個身影，愣住，走過去。媽媽慌張收手機：「我……我就路過。」</p>
    <p>女兒沒說話，抱住她。媽媽肩頭抖了抖，小聲說：「你今天真好看。」女兒哭著說：「媽，以後的場合，你坐第一排。」</p>
    </div>
