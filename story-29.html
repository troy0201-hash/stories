    <h1>迷路時的指南針</h1>
    <div class="sub">方向亂了，先停下，比亂走強。</div>
    <div class="story">
    <p>她轉職撞牆，投了百封履歷石沉大海。焦慮到亂接offer。</p>
    <p>一位前輩說：『你不是沒能力，是沒目標。先想清楚要去哪。』</p>
    <p>她花兩週寫下想做的事，再投，命中率翻倍。原來指南針先對準，路才好走。</p>
