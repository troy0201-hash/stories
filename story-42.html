    <h1>窗台上的早晨</h1>
    <div class="sub">光會準時來，你只要拉開窗簾。</div>
    <div class="story">
    <p>他抑鬱時，整天拉著窗簾。媽不說教，只每天早晨把簾拉開一條縫。</p>
    <p>某天他主動全拉開，陽光鋪了一地。他忽然想起，自己喜歡早晨，是從前的事。</p>
    <p>後來他養成習慣：醒了先開窗。光不等誰，但總在。</p>
