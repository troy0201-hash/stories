    <h1>貓與窗與太陽</h1>
    <div class="sub">曬太陽的貓，教會她什麼叫放下。</div>
    <div class="story">
    <p>她焦慮時總停不下來。家裡貓每天趴窗台曬太陽，一曬半晌，毫無罪惡感。</p>
    <p>她學著坐下，學貓那種『現在就現在』。窗光移，她也跟著移。</p>
    <p>某天她發現，焦慮還在，但沒那麼趕著趕走它了。</p>
