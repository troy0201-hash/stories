    <h1>路上的風景</h1>
    <div class="sub">目的地會到，過程才叫人生。</div>
    <div class="story">
    <p>他辭職騎車環島，親友說浪費。他說：『我怕的不是浪費，是老了後悔沒走。』</p>
    <p>三百公里後他曬黑了，也笑了。最難忘不是終點，是某個沒名的海岸。</p>
