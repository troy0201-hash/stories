    <h1>一杯溫度的拿鐵</h1>
    <div class="sub">有些治癒，從一杯剛好的溫度開始。</div>
    <div class="story">
    <p>她連續失眠一週，某早走進常去的咖啡館，店員遞來拿鐵：『今天幫你多放半度熱，手捧著剛好。』</p>
    <p>她愣了——自己從沒說過失眠。店員笑：『你這禮拜來都皺眉，杯子涼了也沒喝。』</p>
    <p>那天她捧著溫拿鐵坐了一會，眉頭鬆了。原來被留意，本身就是一味藥。</p>
