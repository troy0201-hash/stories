    <h1>守塔的人</h1>
    <div class="sub">在沒人看見的地方發光，也是一種勇敢。</div>
    <div class="story">
    <p>偏遠海岬有座老燈塔，守塔人老林獨自待了二十年。颱風夜他沒缺席過一次。</p>
    <p>有人問值得嗎，他說：『船上看見光，就知道家還在。』</p>
    <p>退休那年，漁會送他一塊匾：『暗處的燈，從不問誰看見。』</p>
