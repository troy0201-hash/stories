    <h1>她還記得</h1>
    <div class="sub">記憶會走散，但愛認得路。</div>
    <div class="story">
    <p>媽媽失智後，把大家都忘了。他回家，她問：「你是誰？」他心像被挖空。</p>
    <p>可奇怪的是，每次他要走，她都拉住他衣角，輕聲叫：「阿寶，路上小心。」阿寶是他小名，連他自己都快忘了。</p>
    <p>護理師說，這種深層記憶最後才走。他開始每天來，不指望她認得，只聽她偶爾蹦出那聲「阿寶」。</p>
    <p>有回他感冒，嗓門啞。媽媽忽然伸手摸他額頭，皺眉：「阿寶發燒了。」那是她難得清醒的瞬間。</p>
    <p>他紅著眼點頭。原來無論記憶怎麼散，母親對孩子的那根弦，從來沒斷過。</p>
