    <h1>書店的重逢</h1>
    <div class="sub">有些人走散了，卻還讀著同一本書。</div>
    <div class="story">
    <p>他們當年約定，若還相愛，就在《小王子》那一架碰面。後來吵一架，誰都沒去。</p>
    <p>十年後，她在書店角落抽書，手指碰到另一隻手。抬頭，是他。兩人同時抽出的，是《小王子》。</p>
    <p>誰都沒說話，翻到同一頁——他們當年畫了線的那句：「你下午四點來，從三點起我就開始幸福。」</p>
    <p>他先笑了：「我來晚了十年。」她也笑，眼裡有光：「我也沒準時。」</p>
    <p>他們沒在一起，只是合照一張，背景是那架書。她後來把照片放錢包，像完成了一個當年的約定。</p>
    </div>
