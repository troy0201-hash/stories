    <h1>外婆的毛衣</h1>
    <div class="sub">長輩的愛，常常醜得不起眼，卻暖得要命。</div>
    <div class="story">
    <p>外婆每年織一件毛衣寄來，顏色總是醜醜的橘配綠。她收下，轉手塞進櫃子最底，從沒穿過。</p>
    <p>外婆走後那年冬天特別冷，她翻出那堆毛衣，隨手穿上一件。低頭看針腳，發現領口內側用不同色的線，織了極小的字：「平安」。</p>
    <p>她把每件翻過來看，一件一個字，連起來是：「平、安、喜、樂、健、康」。外婆不識幾個字，顯然是請人一個個教，才織進去的。</p>
    <p>她穿著那件橘綠毛衣出門，寒風裡，胸口像貼著外婆的手。</p>
    </div>
