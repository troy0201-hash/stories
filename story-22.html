    <h1>海邊的第一道光</h1>
    <div class="sub">再長的夜，也擋不住一次日出。</div>
    <div class="story">
    <p>她失業那陣子，每天凌晨失眠。某天索性去海邊走，撞見日出。</p>
    <p>橘紅的光把海面燒開，她忽然覺得：天都肯重新亮一次，我為什麼不行。</p>
    <p>那天起她固定去看日出，順便投履歷。三個月後錄取，她說：『是那道光先錄用了我。』</p>
