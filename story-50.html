    <h1>相握的手</h1>
    <div class="sub">最簡單的陪伴，是手還在。</div>
    <div class="story">
    <p>爺爺臨終，她握著他的手。他已說不出話，卻回握了一下，很輕。</p>
    <p>那一下，她懂：愛不必多說，還在就好。</p>
    <p>後來她難過時，會把手握拳，像握住那一下。</p>
