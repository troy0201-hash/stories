    <h1>煙火前的沉默</h1>
    <div class="sub">最亮的那刻，前面總有一段黑。</div>
    <div class="story">
    <p>她練習鋼琴十年，從沒上台。比賽前夜想退，老師說：『你怕的不是彈錯，是終於被聽見。』</p>
    <p>她上了台，彈完全場靜一秒，才爆出掌聲。那靜，是她最愛的聲音。</p>
