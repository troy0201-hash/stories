    <h1>暖燈下的人</h1>
    <div class="sub">有人等你回家，燈就為你亮。</div>
    <div class="story">
    <p>他加班晚歸，遠遠看見家裡窗亮著一盏小燈。妻說：『怕你摸黑。』</p>
    <p>那盏燈不亮，卻剛好照到鑰匙孔。他每次開門都覺得，被接住了。</p>
    <p>後來他出差，也留一盏燈給妻。亮著，是『我在』的意思。</p>
