    <h1>小男孩的存錢筒</h1>
    <div class="sub">最乾淨的善意，來自還不懂算計的心。</div>
    <div class="story">
    <p>募款攤位前，大人們掃碼捐個整數就走。一個小男孩拉著媽媽衣角，不肯動。</p>
    <p>他蹲下，把卡通存錢筒倒過來，嘩啦倒出一堆硬幣：五塊、十塊、還有幾顆遊戲點數幣。志工說：「小朋友，這個不能捐喔。」</p>
    <p>小男孩認真說：「那我捐真的錢。這些是我存要買玩具的，但電視上說有小朋友沒飯吃，先給他們。」</p>
    <p>媽媽紅了眼，補了一張鈔票進去。小男孩滿意地笑，跑前跑後幫志工遞傳單。</p>
    <p>志工後來說，那天收到最多的，不是某張大鈔，是那隻小手的溫度。</p>
