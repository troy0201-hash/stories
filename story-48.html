    <h1>木書架的安靜</h1>
    <div class="sub">被書包圍，就不那麼孤單。</div>
    <div class="story">
    <p>她搬新家，第一件事擺書架。書一本本上架，房間像有了骨架。</p>
    <p>夜裡她不開電視，只抽一本翻。紙頁味讓她安心，像很多人陪著。</p>
    <p>她說：『朋友會走，書留著。』</p>
