    <h1>小盆栽的力氣</h1>
    <div class="sub">照顧一個生命，也被生命照顧。</div>
    <div class="story">
    <p>他住院，病房空蕩。護士送他一盆綠蘿：『你澆它，它陪你。』</p>
    <p>他每天記得澆水，看新葉舒展。出院那天，綠蘿已爬了半架。</p>
    <p>他帶回家，說：『它比我堅強，我得跟上。』</p>
