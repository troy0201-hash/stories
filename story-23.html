    <h1>最後一名的衝刺</h1>
    <div class="sub">輸贏之外，還有「沒放棄」這種贏法。</div>
    <div class="story">
    <p>校運會一千米，他落後一圈還在跑。看台零星噓聲。</p>
    <p>最後五十公尺，不知誰先鼓掌，全場跟著拍。他紅著眼衝過終點。</p>
    <p>體育老師說：『冠軍每年有，但你這種，一輩子被記住。』</p>
